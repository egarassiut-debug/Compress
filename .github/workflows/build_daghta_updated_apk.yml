name: Build Daghta Updated APK (Android Native)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-native-app/**'
      - '.github/workflows/build_daghta_updated_apk.yml'
  workflow_dispatch:

jobs:
  build-daghta-updated-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Verify Original Native Package & Scanner Sources
        run: |
          grep -q "com.example.legal_file_compressor" android-native-app/app/build.gradle
          grep -q "android.permission.CAMERA" android-native-app/app/src/main/AndroidManifest.xml
          grep -q "DocumentScannerActivity" android-native-app/app/src/main/AndroidManifest.xml
          test -f android-native-app/app/src/main/java/com/example/legal_file_compressor/MainActivity.java
          test -f android-native-app/app/src/main/java/com/example/legal_file_compressor/DocumentScannerActivity.java
          test -f android-native-app/app/src/main/res/layout/activity_document_scanner.xml

      - name: Build Debug APK with Gradle
        working-directory: android-native-app
        run: gradle assembleDebug --no-daemon

      - name: Copy & Rename APK to daghta-updated.apk
        run: |
          mkdir -p out
          cp android-native-app/app/build/outputs/apk/debug/app-debug.apk out/daghta-updated.apk
          ls -lh out/daghta-updated.apk

      - name: Verify Built APK Contents & Compute SHA-256
        run: |
          python3 - << 'EOF'
          import hashlib, zipfile, sys

          apk_path = "out/daghta-updated.apk"
          data = open(apk_path, "rb").read()
          sha256 = hashlib.sha256(data).hexdigest()

          with zipfile.ZipFile(apk_path, "r") as z:
              names = z.namelist()
              dex_bytes = b"".join(z.read(n) for n in names if n.endswith(".dex"))
              manifest = z.read("AndroidManifest.xml") if "AndroidManifest.xml" in names else b""
              manifest_text = manifest.decode("utf-16le", errors="ignore")

              checks = {
                  "has_MainActivity_in_dex": b"MainActivity" in dex_bytes,
                  "has_DocumentScannerActivity_in_dex": b"DocumentScannerActivity" in dex_bytes,
                  "has_scanner_layout": "res/layout/activity_document_scanner.xml" in names,
                  "has_teal_drawable": "res/drawable/bg_card_teal.xml" in names,
                  "has_CAMERA_permission": ("CAMERA" in manifest_text) or (b"CAMERA" in manifest),
                  "has_DocumentScanner_in_manifest": ("DocumentScannerActivity" in manifest_text) or (b"DocumentScannerActivity" in manifest),
              }

          print("APK Size (bytes):", len(data))
          print("APK SHA-256:", sha256)
          for k, v in checks.items():
              print(f"{k}: {v}")

          if not all(checks.values()):
              sys.exit(1)
          EOF
          {
            echo "### Daghta Updated APK Build Summary"
            echo "- Artifact: \`daghta-updated.apk\`"
            echo "- SHA-256: \`$(sha256sum out/daghta-updated.apk | awk '{print $1}')\`"
            echo "- Size: \`$(wc -c < out/daghta-updated.apk) bytes\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daghta-updated.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daghta-updated-apk
          path: out/daghta-updated.apk
          retention-days: 30
